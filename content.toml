# Single source of truth for all page content and site configuration.
# Edit this file to change what the site displays; no component code
# changes are needed.

[site]
title = "JINGYUAN YI"
meta_description = "JINGYUAN YI 的个人主页。"
name = "JINGYUAN YI"
year = 2026

[profile]
tagline = "西安电子科技大学软件工程专业学生，专注 Web 开发。"
bio = """
我是西安电子科技大学软件工程专业的本科生，正在探索 Web 开发与开源。
这个站点是我的互联网一角，用来记录我在学习和构建的东西。
"""
avatar = "" # path under public/, e.g. "avatar.jpg"; empty = no avatar

[[profile.socials]]
label = "GitHub"
url = "https://github.com/yjydist"

[[profile.socials]]
label = "邮箱"
url = "mailto:yjydist@qq.com"

[github]
# Used for the /repos fetches and the /activity page.
username = "yjydist"

# Each [[repos]] entry declares how its data is sourced via `mode`:
#   mode = "github" -> metadata (description, stars, language, topics,
#   updated_at) is fetched at runtime from the GitHub REST API using the
#   `repo` key. Optional keys below override the API values.
#   mode = "custom" -> fully manual; everything is written here and no
#   network request is made.
# Unknown modes fall back to custom. New providers (e.g. "gitee") can be
# added later without changing the schema.
[[repos]]
mode = "custom"
name = "手动项目"
url = "https://github.com/your-username/project-two"
description = "用一两句话介绍这个项目：它做什么、为什么对你重要。"
tags = ["Python", "CLI"]

[[experience]]
period = "2024 — 至今"
role = "你的职位"
organization = "所属组织"
description = "用一句话说明你做了什么、学到了什么。"

[[experience]]
period = "2022 — 2024"
role = "之前的职位"
organization = "之前的组织"
description = "用一句话说明你做了什么、学到了什么。"
