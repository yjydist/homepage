name: Refresh GitHub data

on:
  schedule:
    # Every 6 hours, off the hour: the data is a snapshot, and a fixed
    # minute keeps consecutive runs predictable.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-github-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Fetch snapshot
        run: bun run fetch:github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit snapshot if it changed
        run: |
          if [ -z "$(git status --porcelain -- src/generated/github-data.json)" ]; then
            echo "Snapshot unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generated/github-data.json
          git commit -m "chore(data): refresh github snapshot"
          git push
