# Single source of truth for all page content and site configuration.
# Edit this file to change what the site displays; no component code
# changes are needed.

[site]
title = "Your Name"
meta_description = "Personal homepage of Your Name."
name = "Your Name"
year = 2026

[profile]
tagline = "A one-line tagline goes here."
bio = """
Write a short introduction here. Who you are, what you care about,
what you are building or learning right now. Keep it brief: this is a
business card, not a resume.
"""
avatar = "" # path under public/, e.g. "avatar.jpg"; empty = no avatar

[[profile.socials]]
label = "GitHub"
url = "https://github.com/your-username"

[[profile.socials]]
label = "Email"
url = "mailto:you@example.com"

[github]
# Used for the /repos fetches and the /activity page.
username = "your-username"

# Each [[repos]] entry declares how its data is sourced via `mode`:
#   mode = "github" -> metadata (description, stars, language, topics,
#   updated_at) is fetched at runtime from the GitHub REST API using the
#   `repo` key. Optional keys below override the API values.
#   mode = "custom" -> fully manual; everything is written here and no
#   network request is made.
# Unknown modes fall back to custom. New providers (e.g. "gitee") can be
# added later without changing the schema.
[[repos]]
mode = "github"
repo = "your-username/project-one"
# description = "Override the repo's GitHub description."
# tags = ["TypeScript", "React"]  # overrides API topics
# pinned = true                   # pinned entries sort first
# order = 1                       # explicit sort order among unpinned

[[repos]]
mode = "custom"
name = "Manual Project"
url = "https://github.com/your-username/project-two"
description = "One or two sentences about this project: what it does and why it matters to you."
tags = ["Python", "CLI"]

[[experience]]
period = "2024 — Present"
role = "Your Role"
organization = "Organization"
description = "What you did and what you learned, in one sentence."

[[experience]]
period = "2022 — 2024"
role = "Previous Role"
organization = "Previous Organization"
description = "What you did and what you learned, in one sentence."
